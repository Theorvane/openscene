# Packaging for the release workflow. electron-vite compiles main, preload, and
# renderer into out/; this only wraps that output into a macOS app.
appId: tech.theorvane.openvideo
productName: OpenVideo
copyright: Open source under the MIT License
# Declared so electron-builder generates the latest*.yml update manifests the
# in-app updater reads. The release workflow uploads the artifacts itself with
# `--publish never`, so nothing is pushed from a packaging run.
publish:
  provider: github
  owner: Theorvane
  repo: openvideo
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # The window icon is read from resources/ at runtime on platforms that take one.
  - from: resources/icon.png
    to: icon.png
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Apple Developer credentials exist for this repository, so the build is
  # unsigned; forcing discovery off keeps CI from failing on a missing identity.
  identity: null
win:
  icon: build/icon.png
  # No code-signing certificate either, so Windows SmartScreen warns on first run.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
deb:
  packageName: openvideo
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  # The deb package name, the binary, and the artifact filename all default to
  # package.json's `name`, so an install reads video-window-recorder while
  # everything the user sees says OpenVideo. executableName fixes the binary and
  # the desktop entry; artifactName and the deb package name are set separately
  # because electron-builder derives neither from it.
  executableName: openvideo
  artifactName: openvideo-${version}-${arch}.${ext}
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
