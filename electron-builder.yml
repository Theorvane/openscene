# Packaging for the release workflow. electron-vite compiles main, preload, and
# renderer into out/; this only wraps that output into a macOS app.
appId: tech.theorvane.openvideo
productName: OpenVideo
copyright: Open source under the MIT License
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # The window icon is read from resources/ at runtime on platforms that take one.
  - from: resources/icon.png
    to: icon.png
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Apple Developer credentials exist for this repository, so the build is
  # unsigned; forcing discovery off keeps CI from failing on a missing identity.
  identity: null
win:
  icon: build/icon.png
  # No code-signing certificate either, so Windows SmartScreen warns on first run.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
