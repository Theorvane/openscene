<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1735"/><stop offset="0.55" stop-color="#12101f"/><stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a690ff"/><stop offset="1" stop-color="#78f7bc"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="16"/>
  <!-- timeline track -->
  <rect x="176" y="668" width="672" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="176" y="668" width="300" height="26" rx="13" fill="url(#mark)" fill-opacity="0.85"/>
  <!-- playhead -->
  <rect x="466" y="616" width="10" height="130" rx="5" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="471" cy="606" r="20" fill="#ffffff"/>
  <!-- play mark -->
  <g filter="url(#glow)">
    <path d="M404 254 L404 526 L664 390 Z" fill="url(#mark)" stroke="url(#mark)" stroke-width="56" stroke-linejoin="round"/>
  </g>
</svg>
