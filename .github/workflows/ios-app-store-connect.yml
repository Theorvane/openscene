name: iOS App Store Connect

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: app-store-connect-production
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload iOS app
    # Expo's Swift package dependencies require Swift tools 6.2 or newer.
    runs-on: macos-26
    environment: app-store-production
    env:
      # The application identifier, named once: the signing check, the export
      # options and the app itself all have to agree on it.
      BUNDLE_ID: com.sloki9637.openscene
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Optional. The profile names itself; this is only cross-checked against it,
      # so a stale value is reported rather than silently signed with.
      EXPECTED_PROFILE_NAME: ${{ vars.APP_STORE_PROFILE_NAME }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install App Store signing assets
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$APP_STORE_PROVISIONING_PROFILE_BASE64"

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-store-signing.keychain-db"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$(uuidgen).mobileprovision"

          # The profile names itself, so ask it rather than keeping a copy of the
          # answer in a variable. The copy is the thing nobody updates when the
          # profile is rotated: this release failed on a name last set five weeks
          # before the profile that replaced it, and xcodebuild only said so
          # after a pod install and a full archive.
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_NAME="$(/usr/bin/plutil -extract Name raw -o - "$PLIST")"
          PROFILE_APP_ID="$(/usr/bin/plutil -extract Entitlements.application-identifier raw -o - "$PLIST")"
          echo "Signing with provisioning profile: $PROFILE_NAME"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          # Checked here, where the profile is already open, rather than by
          # xcodebuild several minutes later. A wildcard profile is legitimate
          # for an app with no entitlements that require an explicit one, so it
          # is matched as a prefix rather than rejected for not being identical.
          case "$PROFILE_APP_ID" in
            "$APPLE_TEAM_ID.$BUNDLE_ID") ;;
            *\*)
              # A wildcard covers the app when the identifier begins with
              # everything before the star — which is the rule for `TEAM.*` and
              # `TEAM.com.*` alike, rather than two special cases.
              case "$APPLE_TEAM_ID.$BUNDLE_ID" in
                "${PROFILE_APP_ID%\*}"*)
                  echo "::warning::Signing with the wildcard profile $PROFILE_APP_ID." ;;
                *)
                  echo "::error::The provisioning profile covers $PROFILE_APP_ID, which does not include $APPLE_TEAM_ID.$BUNDLE_ID."
                  exit 1 ;;
              esac
              ;;
            *)
              echo "::error::The provisioning profile is for $PROFILE_APP_ID, but this app is $APPLE_TEAM_ID.$BUNDLE_ID."
              exit 1
              ;;
          esac

          # A variable that disagrees with the installed profile is a leftover,
          # and saying so is more use than either ignoring it or failing on it.
          if [ -n "${EXPECTED_PROFILE_NAME:-}" ] && [ "$EXPECTED_PROFILE_NAME" != "$PROFILE_NAME" ]; then
            echo "::warning::APP_STORE_PROFILE_NAME is '$EXPECTED_PROFILE_NAME' but the installed profile is '$PROFILE_NAME'. The profile wins; update or delete the variable."
          fi

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Archive the App Store build
        working-directory: mobile
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/OpenScene.xcworkspace \
            -scheme OpenScene \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenScene.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            archive

      - name: Export the IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/bin/plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenScene.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$API_KEY_PATH"
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/OpenScene.ipa" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --p8-file-path "$API_KEY_PATH"
