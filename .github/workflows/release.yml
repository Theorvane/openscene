name: release

# Promotion to main is the release trigger. The version in package.json decides
# whether this is a release at all: if v<version> is already tagged, nothing
# runs, so an ordinary push to main cannot publish a second time.
on:
  push:
    branches: [main]

# Read by default. Only the job that writes a tag and a release is given
# `contents: write`, and it is the last one to run — the jobs before it install
# and execute third-party tooling, which is exactly what a token scoped wider
# than its work is for.
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      already-released: ${{ steps.version.outputs.already-released }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Nothing here pushes, and everything after it runs `npm ci` and the
          # tooling that comes with it. A checkout credential left in the runner's
          # git config is one `npm` postinstall away from being someone else's.
          persist-credentials: false

      - id: version
        name: Read the version and decide whether it is unreleased
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already tagged; skipping the release."
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.version.outputs.already-released == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        if: steps.version.outputs.already-released == 'false'
        run: npm ci

      # The same install ci.yml needs, for the same two reasons: the mobile app
      # has a typecheck of its own that every change touching it must pass, and
      # the tests covering mobile rules import those modules, which makes esbuild
      # read `mobile/tsconfig.json` and resolve the Expo base it extends. Without
      # it the suite fails on a tsconfig before a single assertion runs — and it
      # did, silently passing 773 of 816 tests and calling that a verified
      # release.
      - name: Install mobile dependencies
        if: steps.version.outputs.already-released == 'false'
        working-directory: mobile
        run: npm ci

      # The export and import tests drive a real FFmpeg binary rather than a
      # stub, so the release gate needs the same toolchain ci.yml gives every
      # PR. Without it the suite fails on its environment, not on the commit.
      - name: Install FFmpeg
        if: steps.version.outputs.already-released == 'false'
        run: brew install ffmpeg

      # Verified once, on the platform the test suite is developed against.
      # The per-platform jobs below package; they do not re-run the suite.
      #
      # This has to verify everything a pull request does. A release gate that
      # checks less than the branch it is releasing is worse than none: it
      # reports success for work nothing ever ran.
      - name: Verify the commit being released
        if: steps.version.outputs.already-released == 'false'
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Typecheck the mobile app
        if: steps.version.outputs.already-released == 'false'
        working-directory: mobile
        run: npm run typecheck

  build:
    needs: check
    if: needs.check.outputs.already-released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform is packaged on its own runner: electron-builder can
          # only produce a signed-shaped, native-dependency-correct bundle there.
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job packages three platforms and runs a great deal of installed
          # tooling to do it. None of that needs a token that can write to the
          # repository, so it does not get one.
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the application bundle
        run: npm run build

      - name: Package ${{ matrix.platform }}
        env:
          # macOS signs with the Developer ID certificate and notarizes. No
          # Windows certificate exists, and auto-discovery there would only find
          # nothing slowly.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' }}
          # The certificate goes to the macOS leg and nowhere else. `CSC_LINK` is
          # not a macOS variable: on Windows electron-builder reads the same one
          # and signs the installer with whatever PFX it points at, so handing it
          # to every leg put an Apple Developer ID signature on the `.exe`.
          # Windows cannot chain that to a trusted root, and signing also writes
          # the certificate's subject into `app-update.yml` as the publisher name
          # — which turns on a signature check that can then never pass. Every
          # Windows update was refused with "not signed by the application
          # owner", silently, from the user's side of it.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # electron-builder skips notarization *silently* when the credentials are
      # missing — "skipped macOS notarization" is a log line, not a failure. That
      # would publish a build Gatekeeper still rejects while the release notes
      # say it opens normally. Assert the result instead of trusting the run.
      - name: Verify the macOS build is signed, hardened, and notarized
        if: matrix.platform == 'mac'
        run: |
          for app in dist/mac*/*.app; do
            echo "checking $app"
            codesign --verify --deep --strict --verbose=1 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' || {
              echo "::error::$app is not built with the hardened runtime"; exit 1; }
            xcrun stapler validate "$app"
            spctl -a -vvv -t exec "$app"
          done

      # latest*.yml and the blockmaps are what the in-app updater reads; shipping
      # only the installers leaves it unable to see that a release happened.
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: openscene-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  app-store-connect:
    needs: [check, build]
    if: needs.check.outputs.already-released == 'false'
    uses: ./.github/workflows/ios-app-store-connect.yml
    secrets: inherit

  # Last, and after iOS on purpose. The two store jobs are not equally
  # reversible: the iOS job uploads a build and submits nothing, while this one
  # publishes to the Play production track with status `completed`, which is
  # live to every user the moment it lands. Run in parallel, an iOS failure
  # after Play had already published left the release shipped and *untagged* —
  # `release` never ran — so a later push to `main` re-entered the pipeline and
  # re-uploaded the same `versionCode`, which Play rejects. Live, unrecorded and
  # stuck until someone bumped the version. The parallelism was worth less than
  # that. See RELEASING.md for the smaller residual this does not fix.
  google-play:
    needs: [check, build, app-store-connect]
    if: needs.check.outputs.already-released == 'false'
    uses: ./.github/workflows/android-google-play.yml
    with:
      track: production
      release_status: completed
    secrets: inherit

  release:
    needs: [check, build, app-store-connect, google-play]
    if: needs.check.outputs.already-released == 'false'
    runs-on: ubuntu-latest
    # The one job that writes: the tag and the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag the release and keep it on its own branch
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The check job's guard only covers a fresh push to main. Re-running
          # this job alone replays a tag push that already landed, so ask origin
          # rather than assume. The branch push needs no guard: pushing it again
          # at the same commit is already a no-op, and a different commit under
          # the same release tag is a real conflict worth failing on.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already tagged on origin; keeping the published tag."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          git push origin "HEAD:refs/heads/release/$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # Re-running after a partial upload should repair the release, not
          # fail on the one that is already there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its artifacts."
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --title "OpenScene $TAG" \
              --generate-notes \
              --notes "The macOS builds are signed with a Developer ID certificate and notarized by Apple, so they open normally. The Windows builds are unsigned, so SmartScreen warns on first run: choose More info, then Run anyway. The Linux builds are unsigned, which is normal for AppImage and deb." \
              artifacts/*
          fi
