name: release

# Promotion to main is the release trigger. The version in package.json decides
# whether this is a release at all: if v<version> is already tagged, nothing
# runs, so an ordinary push to main cannot publish a second time.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      already-released: ${{ steps.version.outputs.already-released }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: version
        name: Read the version and decide whether it is unreleased
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already tagged; skipping the release."
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.version.outputs.already-released == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.already-released == 'false'
        run: npm ci

      # The export and import tests drive a real FFmpeg binary rather than a
      # stub, so the release gate needs the same toolchain ci.yml gives every
      # PR. Without it the suite fails on its environment, not on the commit.
      - name: Install FFmpeg
        if: steps.version.outputs.already-released == 'false'
        run: brew install ffmpeg

      # Verified once, on the platform the test suite is developed against.
      # The per-platform jobs below package; they do not re-run the suite.
      - name: Verify the commit being released
        if: steps.version.outputs.already-released == 'false'
        run: |
          npm run typecheck
          npm test
          npm run build

  build:
    needs: check
    if: needs.check.outputs.already-released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform is packaged on its own runner: electron-builder can
          # only produce a signed-shaped, native-dependency-correct bundle there.
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the application bundle
        run: npm run build

      - name: Package ${{ matrix.platform }}
        env:
          # Unsigned on every platform: this repository holds no Apple Developer
          # credentials and no Windows certificate, and auto-discovery would
          # otherwise fail the macOS build looking for an identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: openvideo-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.already-released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag the release and keep it on its own branch
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The check job's guard only covers a fresh push to main. Re-running
          # this job alone replays a tag push that already landed, so ask origin
          # rather than assume. The branch push needs no guard: pushing it again
          # at the same commit is already a no-op, and a different commit under
          # the same release tag is a real conflict worth failing on.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already tagged on origin; keeping the published tag."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          git push origin "HEAD:refs/heads/release/$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # Re-running after a partial upload should repair the release, not
          # fail on the one that is already there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its artifacts."
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --title "OpenVideo $TAG" \
              --generate-notes \
              --notes "These builds are unsigned. macOS reports an unidentified developer and Windows SmartScreen warns on first run; open the app from the Finder context menu, or choose More info then Run anyway, or run OpenVideo from source." \
              artifacts/*
          fi
