name: release

# Promotion to main is the release trigger. The version in package.json decides
# whether this is a release at all: if v<version> is already tagged, every step
# is skipped, so an ordinary push to main cannot publish a second time.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: version
        name: Read the version and decide whether it is unreleased
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "already-released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already tagged; skipping the release."
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.version.outputs.already-released == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.already-released == 'false'
        run: npm ci

      - name: Verify the commit being released
        if: steps.version.outputs.already-released == 'false'
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Package the macOS app
        if: steps.version.outputs.already-released == 'false'
        env:
          # Unsigned: this repository holds no Apple Developer credentials, and
          # auto-discovery would otherwise fail the build looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Tag the release and keep it on its own branch
        if: steps.version.outputs.already-released == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          git push origin "HEAD:refs/heads/release/$TAG"

      - name: Publish the GitHub release
        if: steps.version.outputs.already-released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "OpenVideo $TAG" \
            --generate-notes \
            --notes "This macOS build is unsigned and not notarized, so macOS reports an unidentified developer. Open it from the Finder context menu the first time, or run OpenVideo from source." \
            dist/*.dmg dist/*.zip
