name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Both lockfiles, or the cache key ignores every mobile dependency
          # change and restores a tree that does not match the install below.
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # The mobile app is a separate install, and the suite needs it for two
      # reasons. Its own typecheck is required on every change that touches the
      # app — see "Two Surfaces, One Core" in AGENTS.md — and the tests that
      # cover mobile rules import those modules directly, which makes esbuild
      # read `mobile/tsconfig.json`. That file extends `expo/tsconfig.base`, so
      # without this the transform fails before a single assertion runs and the
      # failure names a tsconfig rather than the missing install.
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - run: brew install ffmpeg
      - run: npm run typecheck
      - name: Typecheck the mobile app
        working-directory: mobile
        run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The Swift is compiled, not just written.
  #
  # The iOS export module was changed twice without anything ever building it:
  # the suite is TypeScript, the Android module is compiled by its own Gradle
  # build, and Swift had no equivalent — so "it typechecks and the tests pass"
  # said nothing at all about half the native code. Review asked for exact-head
  # evidence and was right to.
  #
  # A simulator build with signing off needs no certificate, profile or secret,
  # which is what makes this runnable on every pull request rather than only on
  # a release.
  ios-module:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: |
          # A clean runner has no lockfile to reuse, but forcing a complete CDN
          # refresh fetches every historical adapter spec and regularly hits 429.
          # Resolve only this project, retrying the provider transiently instead.
          for attempt in 1 2 3; do
            if pod install; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 20))"
          done

      # `build`, not `archive`: the question is whether the module compiles, and
      # an archive would drag in signing this job deliberately does not have.
      - name: Build the iOS app for the simulator
        working-directory: mobile
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/OpenScene.xcworkspace \
            -scheme OpenScene \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  # The Android app is compiled, for the same reason the iOS one is — and this
  # job exists because the reason turned out to be real.
  #
  # `ironsource-mediation@3.2.0` does not compile against React Native 0.86 at
  # all (React Native moved `getCurrentActivity()` to Kotlin, where the
  # synthetic-property form no longer resolves), and the Pangle adapter throws
  # `NoSuchMethodError` at init against the wrong SDK version. Typecheck and unit
  # tests were green through both. Only assembling the app says whether the
  # native side of this repository still builds.
  #
  # `assembleDebug` needs no keystore — the release signing config falls back to
  # the debug key when the Gradle properties are absent — so this runs on every
  # pull request rather than only on a release.
  android-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # The config plugin's work, asserted where it lands rather than only in the
      # unit test that reads the plugin's source: an adapter that never reaches
      # `app/build.gradle` is a network that silently never bids.
      - name: Check the mediation adapters reached the Gradle files
        working-directory: mobile
        run: |
          set -euo pipefail
          for artifact in unityads-adapter applovin-adapter facebook-adapter pangle-adapter; do
            grep -q "ads-mediation:${artifact}" android/app/build.gradle
          done
          grep -q 'artifact.bytedance.com/repository/pangle' android/build.gradle

      - name: Build the Android app
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

  # The iOS renderer is run, not only compiled.
  #
  # `ios-module` proves the Swift builds, which says nothing about whether an
  # exported file has the right length or whether a dip actually darkens. Every
  # rendering bug this project has had was found by exporting and measuring, and
  # iOS was the one renderer nothing could export from: its composition logic sat
  # inside an Expo module, reachable only from a running app on a device.
  #
  # `VideoComposer` has no Expo in it now, so a Mac runner exports real files
  # through exactly the code a phone uses — no simulator needed, because
  # AVFoundation, Core Graphics and Core Animation are all on macOS too.
  ios-export:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run the composer's export tests
        working-directory: mobile/modules/video-export/composer-tests
        run: swift test
